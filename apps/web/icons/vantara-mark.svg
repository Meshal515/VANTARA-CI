<!--
  ⚠️ هذه ليست علامة VANTARA النهائية. ضع الأصلية مكان هذا الملف.

      cp <شعار-VANTARA>.svg apps/web/icons/vantara-mark.svg
      node tools/build-icons.mjs

  الأمر الثاني يولّد كل المقاسات: أيقونات الويب، وmaskable، وapple-touch،
  وfavicon، وأيقونات مُشغّل أندرويد بكل كثافاتها. فالشعار يُستبدل من مكان
  واحد ولا يُلمس شيء غيره. وPNG أو WebP يعمل أيضًا: بدّل الوسم إلى
  <image href="..." width="512" height="512"/> داخل نفس الـsvg.

  ما هنا الآن: حرف V الهندسي بشقّيه بلون VANTARA على أسود — جوهر العلامة
  بلا رأس الفرس. حاولت تتبّع الشعال الكامل من الصورة أربع مرات ولم يبلغ
  مستوى يُشحن: رأس الفرس كان يُقرأ كقطة أو ككتلة ملتصقة بالحلقة. حرفٌ نظيف
  أصدق من فرس مشوّه، والملف الأصلي يحلّ المسألة في أمرين.
-->
