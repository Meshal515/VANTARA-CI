[project]
name = "vantara-translation-worker"
version = "0.1.0"
requires-python = ">=3.11"
description = "الترجمة العربية: الكشف والـOCR من محرك جاهز، والرسم العربي من طبقتنا"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
